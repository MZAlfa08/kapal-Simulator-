<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kapal Kapal – Kapal Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div class="stats"><b id="hPort"></b><b id="hMoney">Rp 0</b><span id="hPass"></span><span id="hCargo"></span></div>
  <div id="hDest"></div>
  <canvas id="mini" width="260" height="56"></canvas>
  <div class="btns"><button id="bMap">Peta (M)</button><button id="bMenu">Menu</button></div>
  <div id="ctl">
    <button id="bBrake" class="pedal brake" aria-label="Rem">
      <svg viewBox="0 0 40 40"><rect x="7" y="7" width="26" height="26" rx="6" fill="#fff"/><path d="M12 15h16M12 20h16M12 25h16" stroke="#c8321f" stroke-width="2.5" stroke-linecap="round"/></svg>REM
    </button>
    <div id="gwrap"><canvas id="gauge" width="220" height="125"></canvas><button id="bFlip">⇄ Putar haluan</button></div>
    <button id="bGas" class="pedal gas" aria-label="Gas">
      <svg viewBox="0 0 40 40"><path d="M9 21l11-11 11 11M9 32l11-11 11 11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>GAS
    </button>
  </div>
</div>

<section id="menu" class="screen">
  <h1>Kapal Kapal</h1>
  <p class="sub">Kapal Simulator Nusantara</p>
  <nav>
    <button id="bPlay" class="big">Mulai</button>
    <button id="bShop">Toko</button>
    <button id="bSet">Pengaturan</button>
  </nav>
  <p id="mMoney" class="sub"></p>
</section>

<section id="shop" class="screen panel hide">
  <header><h2>Toko Kapal</h2><b id="shopMoney"></b><button id="shopBack">Kembali</button></header>
  <div id="shopList"></div>
</section>

<section id="settings" class="screen panel hide">
  <header><h2>Pengaturan</h2><button id="setBack">Kembali</button></header>
  <label><input type="checkbox" id="sSound"> Suara</label>
  <label><input type="checkbox" id="sMini"> Tampilkan peta rute</label>
  <label><input type="checkbox" id="sWave"> Gelombang air</label>
  <button id="sReset" class="danger">Hapus semua kemajuan</button>
</section>

<div id="mapov" class="hide"><canvas id="big"></canvas></div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="draw.js"></script>
<script src="game.js"></script>
</body>
</html>
